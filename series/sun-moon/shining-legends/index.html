<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shining Legends – Sun and Moon | Geek's Guild</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../../favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../../favicon-16x16.png" />
  <link rel="stylesheet" href="../../../geeksguild.css" />
</head>
<body data-series="Sun and Moon">
  <header>
    <div class="header-content">
      <img src="../../../geeksguild-logo.png" alt="Geek's Guild Logo" class="header-logo" />
    </div>
    <nav>
      <div class="nav-links">
        <a href="../../../index.html">Home</a>
        <a href="../../../shop.html">Shop</a>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search cards..." />
        <div id="search-results"></div>
      </div>
    </nav>
  </header>

  <main class="hero">
    <h2>Shining Legends</h2>
    <p>Browse the cards in this set.</p>
  </main>

  <section class="card-grid">
    
      <div class="card" 
           data-card-number="21" 
           data-set="Shining Legends" 
           data-rarity="Common" 
           data-quantity="0"
           data-reverse-holo="1"
           data-pokeball="0"
           data-masterball="0"
           data-variants='["Reverse Holo"]'>
        <h3>Qwilfish</h3>
        <img src="../../../images/cards/sun-moon/shining-legends/21.jpg" alt="Qwilfish" onerror="this.src='../../../images/default-card.jpg'" />
        
      </div>
    

      <div class="card" 
           data-card-number="50" 
           data-set="Shining Legends" 
           data-rarity="Common" 
           data-quantity="1"
           data-reverse-holo="0"
           data-pokeball="0"
           data-masterball="0"
           data-variants='["Normal"]'>
        <h3>Scraggy</h3>
        <img src="../../../images/cards/sun-moon/shining-legends/50.jpg" alt="Scraggy" onerror="this.src='../../../images/default-card.jpg'" />
        
      </div>
    
  </section>

  <script src="../../../lightbox.js"></script>
  <script src="../../../search.js"></script>
</body>
</html>
