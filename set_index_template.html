<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{setName}} – {{seriesName}} | Geek's Guild</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../../favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../../favicon-16x16.png" />
  <link rel="stylesheet" href="{{cssPath}}" />
</head>
<body data-series="{{seriesName}}">
  <header>
    <div class="header-content">
      <a href="../../../index.html">
        <img src="../../../geeksguild-logo.png" alt="Geek's Guild Logo" class="header-logo" />
      </a>
      <nav>
        <div class="nav-links">
          <a href="../../../index.html">Home</a>
          <a href="../../../shop.html">Shop</a>
        </div>
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search cards..." />
          <div id="search-results"></div>
        </div>
      </nav>
    </div>
  </header>

  <main class="hero">
    <h2>{{setName}}</h2>
    <p>Browse the cards in this set.</p>
  </main>

  <section class="card-grid">
    {{cardList}}
  </section>

  <script src="../../../lightbox.js"></script>
  <script src="../../../search.js"></script>
</body>
</html>
