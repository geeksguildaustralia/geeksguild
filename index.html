<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Geek's Guild
  </title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="stylesheet" href="geeksguild.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <img src="geeksguild-logo.png" alt="Geek's Guild Logo" class="header-logo" />
    </div>
    <nav>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search cards..." />
        <div id="search-results"></div>
      </div>
    </nav>
  </header>

  <main class="hero">
    <h2>World Of Rare Pokémon Cards</h2>
    <p>Welcome to the world of rare Pokémon cards. Explore the best cards from hand-picked collections and find the hidden gem.</p>
    <div class="hero-buttons">
      <a href="shop.html" class="btn btn-primary">Discover More</a>
      <a href="shop.html" class="btn btn-secondary">All Collections</a>
    </div>
  </main>

  <section class="featured-section">
    <div class="featured-carousel">
      <button class="carousel-btn carousel-prev">&lt;</button>
      <div class="carousel-container">
        <div class="carousel-track" id="featuredCardsTrack">
          <!-- Featured cards will be loaded here -->
        </div>
      </div>
      <button class="carousel-btn carousel-next">&gt;</button>
    </div>
    <div class="carousel-pagination" id="carouselPagination"></div>
  </section>

  <footer>
    <p>&copy; 2025 Geek's Guild</p>
  </footer>
  <script src="search.js"></script>
  <script src="featured-cards.js"></script>
</body>
</html>
